# Tripwise GraphQL schema — the single source of truth.
# Server resolver types and client hooks are generated from this file (`pnpm codegen`).

scalar DateTime
scalar Date

enum TripRole {
  OWNER
  EDITOR
  VIEWER
}

enum ActivityStatus {
  PROPOSED
  SCHEDULED
  DECLINED
}

enum BookingType {
  FLIGHT
  STAY
  EVENT
  ATTRACTION
  TOUR
  TRANSPORT
  DINING
  OTHER
}

enum BookingStatus {
  CONFIRMED
  NEEDS_DETAILS
  CANCELLED
}

enum BookingSource {
  MANUAL
  EMAIL
  PDF
  IMAGE
  TEXT
}

enum SplitMethod {
  EQUAL
  PERCENT
  EXACT
}

type User {
  id: ID!
  email: String!
  name: String!
}

"A real place (Google Places). Only its id and coordinates are stored; details are fetched live."
type Place {
  id: ID!
  googlePlaceId: String!
  lat: Float!
  lng: Float!
  "Name, rating, hours and photo, fetched from Google when asked for. Null when Google can't be reached."
  details: PlaceDetails
}

type PlaceDetails {
  name: String!
  address: String
  "What kind of place it is, e.g. Museum."
  kind: String
  rating: Float
  ratingCount: Int
  "0 (free) to 4 (very expensive)."
  priceLevel: Int
  "One line per weekday, e.g. Monday: 9:00 AM – 6:00 PM."
  openingHours: [String!]!
  openNow: Boolean
  "Google Maps page for the place (required alongside Google content)."
  mapsUrl: String
  website: String
  "A photo URL (no API key in it), or null."
  photoUrl: String
  "Photo authors to credit next to the photo."
  photoAuthors: [PhotoAuthor!]!
}

type PhotoAuthor {
  name: String!
  url: String
}

"A real place found by search; nothing is stored until it's attached to an activity."
type PlaceMatch {
  googlePlaceId: String!
  name: String!
  address: String
  kind: String
  lat: Float!
  lng: Float!
}

"How the web app loads the map. The browser key is public by design (restricted to the site)."
type MapsConfig {
  "Place search and details are available (server key set)."
  placesEnabled: Boolean!
  "The map can be shown (browser key set)."
  mapEnabled: Boolean!
  browserKey: String
  mapId: String!
}

"A personal access token for connecting an AI assistant (MCP). The token itself is never returned again after creation."
type ApiToken {
  id: ID!
  name: String!
  "First characters of the token, e.g. \"tw_pat_ab12\", to tell tokens apart."
  prefix: String!
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type CreatedApiToken {
  "The full token. Shown once; only a hash is stored."
  token: String!
  apiToken: ApiToken!
}

type TripMember {
  user: User!
  role: TripRole!
  joinedAt: DateTime!
}

type Trip {
  id: ID!
  name: String!
  destination: String!
  startDate: Date!
  endDate: Date!
  currency: String!
  voteThreshold: Int!
  members: [TripMember!]!
  days: [Day!]!
  "One day of this trip (for the day planner, which works a day at a time)."
  day(id: ID!): Day
  proposals(status: ActivityStatus = PROPOSED): [Activity!]!
  proposalCounts: ProposalCounts!
  "Scheduled activities that are not assigned to a day yet."
  unplannedActivities: [Activity!]!
  expenses: [Expense!]!
  expenseSummary: ExpenseSummary!
  "Net balance per member. Positive = the group owes them. Always sums to zero."
  balances: [Balance!]!
  "Suggested payments that clear every balance."
  settlements: [Settlement!]!
  "The current viewer's role on this trip."
  myRole: TripRole!
  "First-run setup checklist (bookings, invites, expenses), as the viewer sees it."
  setup: TripSetup!
  "IANA time zone for the destination, e.g. \"Europe/Lisbon\"."
  timeZone: String!
  "How full a day should be; the day planner's checks follow it."
  pace: Pace!
  "How the group gets between stops (sets the planner's travel times)."
  getAround: GetAround!
  bookings: [Booking!]!
  booking(id: ID!): Booking
  bookingStats: BookingStats!
  "The next booking (or flight leg) that hasn't started yet."
  upNext: UpNext
  "Bookings and scheduled plans for one trip day, in time order."
  agenda(dayId: ID!): [AgendaItem!]!
  "Upcoming reminders for the viewer, soonest first."
  reminders(limit: Int = 5): [Reminder!]!
  myReminderPreferences: ReminderPreferences!
  "Most recent documents first."
  attachments(limit: Int = 20): [Attachment!]!
  "Private, read-only iCalendar feed (created on first request)."
  calendarUrl: String!
}

"What a new trip still needs. Shown to the owner on Today until done or hidden."
type TripSetup {
  hasBookings: Boolean!
  "Someone else has joined, or the viewer has created an invite link."
  hasInvited: Boolean!
  hasExpenses: Boolean!
  "The viewer hid the checklist."
  hidden: Boolean!
}

type BookingStats {
  total: Int!
  needsDetails: Int!
}

type Booking {
  id: ID!
  type: BookingType!
  status: BookingStatus!
  source: BookingSource!
  title: String!
  provider: String
  confirmationCode: String
  bookingUrl: String
  startsAt: DateTime
  endsAt: DateTime
  "IANA zone or fixed offset (\"+01:00\") the times are shown in."
  timeZone: String
  "Wall-clock start in the booking's zone, \"YYYY-MM-DDTHH:mm\"."
  startLocal: String
  endLocal: String
  location: String
  address: String
  "Decimal string."
  price: String
  currency: String
  travellers: Int
  notes: String
  segments: [BookingSegment!]!
  attachments: [Attachment!]!
  "Fields that should be filled in before the booking is complete."
  missingFields: [String!]!
  createdBy: User!
  createdAt: DateTime!
  "Where a stay is on the map (matched from its address once)."
  place: Place
}

type BookingSegment {
  id: ID!
  position: Int!
  carrier: String
  number: String
  fromCode: String
  fromName: String
  toCode: String
  toName: String
  departsAt: DateTime!
  arrivesAt: DateTime
  departTz: String
  arriveTz: String
  departLocal: String!
  arriveLocal: String
}

type Attachment {
  id: ID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  createdAt: DateTime!
  uploadedBy: User!
  booking: Booking
  "Short-lived signed download URL."
  url: String!
}

type UpNext {
  booking: Booking!
  "The specific flight/train leg, when the booking has several."
  segment: BookingSegment
  startsAt: DateTime!
}

enum AgendaKind {
  BOOKING
  CHECK_IN
  CHECK_OUT
  ACTIVITY
}

type AgendaItem {
  kind: AgendaKind!
  "Local time \"HH:mm\", or null when not set."
  time: String
  title: String!
  subtitle: String
  booking: Booking
  activity: Activity
}

type StayNight {
  booking: Booking!
  "1-based night number, 0 on the check-out day."
  night: Int!
  nights: Int!
  isCheckIn: Boolean!
  isCheckOut: Boolean!
}

enum ReminderKind {
  CHECK_IN_OPENS
  LEAVE_FOR_AIRPORT
  CHECK_OUT
  STARTING_SOON
}

type Reminder {
  key: ID!
  kind: ReminderKind!
  title: String!
  body: String!
  fireAt: DateTime!
  "When the thing it reminds about happens (departure, check-out, start). Past it, the reminder is moot."
  targetAt: DateTime!
  booking: Booking!
}

type ReminderPreferences {
  checkIn: Boolean!
  leaveForAirport: Boolean!
  checkOut: Boolean!
  startingSoon: Boolean!
  email: Boolean!
}

"What the importer found in an uploaded file or pasted text. Nothing is saved until createBooking."
type BookingDraft {
  type: BookingType!
  title: String!
  provider: String
  confirmationCode: String
  bookingUrl: String
  startLocal: String
  endLocal: String
  timeZone: String
  location: String
  address: String
  price: String
  currency: String
  travellers: Int
  notes: String
  segments: [SegmentDraft!]!
  "Names of fields that were read from the source."
  fromSource: [String!]!
  "Fields the importer couldn't verify against the file (shown as \"Check this\")."
  toCheck: [String!]!
  source: BookingSource!
  attachmentId: ID
  sourceName: String
}

type SegmentDraft {
  carrier: String
  number: String
  fromCode: String
  fromName: String
  toCode: String
  toName: String
  departLocal: String!
  arriveLocal: String
  departTz: String
  arriveTz: String
}

type ProposalCounts {
  proposed: Int!
  scheduled: Int!
  declined: Int!
}

type ExpenseSplit {
  user: User!
  "Decimal string."
  amount: String!
}

type Expense {
  id: ID!
  description: String!
  category: String!
  "Decimal string, e.g. \"184.00\"."
  amount: String!
  splitMethod: SplitMethod!
  spentAt: DateTime!
  paidBy: User!
  splits: [ExpenseSplit!]!
  "The viewer's share of this expense (\"0.00\" if not included)."
  viewerShare: String!
  "True for 'Mark paid' settlement entries."
  isSettlement: Boolean!
}

type ExpenseSummary {
  "Sum of all expenses excluding settlements."
  total: String!
  viewerPaid: String!
  viewerBalance: String!
  expenseCount: Int!
}

type Balance {
  user: User!
  "Signed decimal string."
  amount: String!
}

type Settlement {
  from: User!
  to: User!
  amount: String!
}

type InvitePreview {
  tripId: ID!
  tripName: String!
  destination: String!
  role: TripRole!
  invitedBy: String!
  alreadyMember: Boolean!
}

type Day {
  id: ID!
  date: Date!
  position: Int!
  activities: [Activity!]!
  "Bookings that start this day (stays are reported via `stay`)."
  bookings: [Booking!]!
  stay: StayNight
  "The day laid out in time with travel between stops, and anything that doesn't work."
  plan: DayPlan!
  "The day re-ordered by route from the stay, if that's better. Editors apply it with arrangeDay."
  arrangement: DayArrangement!
}

enum Pace {
  RELAXED
  BALANCED
  PACKED
}

enum GetAround {
  WALK_TRANSIT
  DRIVE
}

enum TravelMode {
  WALK
  TRANSIT
  DRIVE
}

enum PlanIssueKind {
  "Planned while the place is closed."
  CLOSED
  "Not enough time to get there from the previous stop."
  TIGHT
  "Starts before the previous stop ends."
  OVERLAP
  "A long trip across town for the trip's pace."
  LONG_TRAVEL
  "Before the group lands, or after it must leave for the airport."
  OUTSIDE_WINDOW
  "At the same time as a booked event."
  BOOKING_CLASH
  "Too much for the trip's pace."
  PACKED
  "No time for lunch."
  NO_LUNCH
}

type TravelLeg {
  minutes: Int!
  mode: TravelMode!
  meters: Int
  "Estimated from distance (no routing service, or it failed)."
  estimated: Boolean!
}

type PlanStop {
  activity: Activity!
  "Local HH:mm."
  start: String!
  end: String!
  durationMinutes: Int!
  "True when the length is typical for the kind of place, not set by the group."
  durationEstimated: Boolean!
  "From the previous stop, or from the stay for the first one. Null when unknown."
  travel: TravelLeg
}

type PlanIssue {
  kind: PlanIssueKind!
  message: String!
  "The stop it's about; null for the whole day."
  activityId: ID
  "True for problems that make the day impossible as planned (the rest are advice)."
  blocking: Boolean!
}

type DayPlan {
  stops: [PlanStop!]!
  issues: [PlanIssue!]!
  "Total travel, back to the stay included."
  travelMinutes: Int!
  startTime: String
  endTime: String
  backToStay: TravelLeg
  travelEstimated: Boolean!
  "Earliest start after an arriving flight (HH:mm), if any."
  freeFrom: String
  "Latest end before a departing flight (HH:mm), if any."
  freeUntil: String
}

type DayArrangement {
  "False when the day is already in a good order (the plan is then today's)."
  better: Boolean!
  savedMinutes: Int!
  "One sentence for the user: what it fixes or saves, or why nothing changes."
  reason: String!
  plan: DayPlan!
}

type Activity {
  id: ID!
  title: String!
  description: String
  location: String
  "Local start time, HH:mm."
  startTime: String
  "Decimal string, e.g. \"45.00\"."
  costPerPerson: String
  status: ActivityStatus!
  position: Int!
  createdBy: User!
  createdAt: DateTime!
  voteCount: Int!
  viewerHasVoted: Boolean!
  "Members who voted for it, in the order they voted."
  voters: [User!]!
  """
  The booking this scheduled plan stands for (same day, same time or no time, and the booking's
  name or place in the plan), so apps show the event once. Null when none matches.
  """
  booking: Booking
  "The real place it happens at, when one was picked."
  place: Place
  "How long it takes, in minutes, when the group set it."
  durationMinutes: Int
}

"Who a valid reset link is for — shown on the reset screen."
type PasswordResetPreview {
  email: String!
}

type AuthPayload {
  user: User!
}

input SignUpInput {
  email: String!
  name: String!
  password: String!
}

input SignInInput {
  email: String!
  password: String!
}

input CreateTripInput {
  name: String!
  destination: String!
  startDate: Date!
  endDate: Date!
  currency: String
  timeZone: String
}

input SegmentInput {
  carrier: String
  number: String
  fromCode: String
  fromName: String
  toCode: String
  toName: String
  "\"YYYY-MM-DDTHH:mm\" in departTz (defaults to the booking's zone)."
  departLocal: String!
  arriveLocal: String
  departTz: String
  arriveTz: String
}

input BookingInput {
  type: BookingType!
  title: String!
  provider: String
  confirmationCode: String
  bookingUrl: String
  "\"YYYY-MM-DDTHH:mm\" (or \"YYYY-MM-DD\") in timeZone."
  startLocal: String
  endLocal: String
  "IANA zone or \"+01:00\"; defaults to the trip's zone."
  timeZone: String
  location: String
  address: String
  price: String
  currency: String
  travellers: Int
  notes: String
  segments: [SegmentInput!]
  status: BookingStatus
}

input ReminderPreferencesInput {
  checkIn: Boolean
  leaveForAirport: Boolean
  checkOut: Boolean
  startingSoon: Boolean
  email: Boolean
}

input ProposeActivityInput {
  tripId: ID!
  title: String!
  description: String
  location: String
  dayId: ID
  startTime: String
  costPerPerson: String
  "Add straight to the itinerary instead of proposing (editors and owners)."
  scheduleNow: Boolean
  "Attach a real place (from placeSuggestions)."
  googlePlaceId: String
}

input MoveActivityInput {
  activityId: ID!
  "Target day; null moves it to 'unplanned'."
  dayId: ID
  "Zero-based index within the target day."
  position: Int!
}

input SplitInput {
  userId: ID!
  "Percent (PERCENT) or amount (EXACT). Ignored for EQUAL."
  value: String
}

input AddExpenseInput {
  tripId: ID!
  description: String!
  category: String
  "Decimal string, e.g. \"184.00\"."
  amount: String!
  paidById: ID!
  splitMethod: SplitMethod!
  "Participants. For EQUAL, the amount is divided between them."
  splits: [SplitInput!]!
  spentAt: DateTime
}

"A place someone might travel to — a destination suggestion for the trip form."
type PlaceSuggestion {
  name: String!
  "State / province / region, when it helps tell places apart."
  region: String
  country: String!
  countryCode: String!
  "Display line, e.g. \"Portland, Oregon, United States\"."
  label: String!
  "Value for the Destination field, e.g. \"Lisbon, Portugal\"."
  destination: String!
  timeZone: String!
  "ISO 4217 currency used there, when known."
  currency: String
}

type Query {
  me: User
  trips: [Trip!]!
  "Destination suggestions as you type (signed-in users; at least 2 characters)."
  placeSearch(query: String!): [PlaceSuggestion!]!
  trip(id: ID!): Trip
  invitePreview(token: String!): InvitePreview
  "The account a reset link is for, or null when the link has expired or was already used."
  passwordResetPreview(token: String!): PasswordResetPreview
  "The viewer's active (not revoked) AI assistant tokens, newest first."
  myApiTokens: [ApiToken!]!
  "Real places matching the text, near the trip's destination. Trip members only."
  placeSuggestions(tripId: ID!, query: String!): [PlaceMatch!]!
  maps: MapsConfig!
  "A place used by this trip (an activity or a stay), with live details. Trip members only."
  place(tripId: ID!, id: ID!): Place
}

type Mutation {
  "Error codes: ACCOUNT_EXISTS (that email already has an account), BAD_USER_INPUT."
  signUp(input: SignUpInput!): AuthPayload!
  signIn(input: SignInInput!): AuthPayload!
  signOut: Boolean!
  """
  Emails a reset link (30 minutes). `next` (an in-app path) is carried through the link.
  Error codes: ACCOUNT_NOT_FOUND, RATE_LIMITED (3 emails per address per hour), EMAIL_UNAVAILABLE.
  The Demo account gets true but is never emailed.
  """
  requestPasswordReset(email: String!, next: String): Boolean!
  """
  Sets a new password from a reset link, signs out every other session, and signs this one in.
  Error codes: INVALID_RESET_LINK (expired, already used, or not a link), BAD_USER_INPUT (too short).
  """
  resetPassword(token: String!, password: String!): AuthPayload!
  createTrip(input: CreateTripInput!): Trip!
  "Owner only. Deletes the trip and everything in it, including uploaded documents."
  deleteTrip(id: ID!): Boolean!
  proposeActivity(input: ProposeActivityInput!): Activity!
  "Toggles the viewer's vote. Proposals reaching the trip's threshold are scheduled."
  toggleVote(activityId: ID!): Activity!
  "Owner only."
  declineActivity(activityId: ID!): Activity!
  moveActivity(input: MoveActivityInput!): Activity!
  addExpense(input: AddExpenseInput!): Expense!
  "Payer or owner."
  deleteExpense(id: ID!): Boolean!
  "Hides the setup checklist for the viewer on this trip."
  hideTripSetup(tripId: ID!): Trip!
  "Owner only. Returns a signed invite token (valid 7 days)."
  createInviteLink(tripId: ID!, role: TripRole!): String!
  joinTrip(token: String!): Trip!
  "Owner only."
  updateMemberRole(tripId: ID!, userId: ID!, role: TripRole!): TripMember!
  "Owner only, or yourself (leave trip)."
  removeMember(tripId: ID!, userId: ID!): Boolean!
  "Editors and owners. Links any uploaded attachments to the new booking."
  createBooking(
    tripId: ID!
    input: BookingInput!
    source: BookingSource
    attachmentIds: [ID!]
  ): Booking!
  updateBooking(id: ID!, input: BookingInput!): Booking!
  "Creator or owner. Attached files are kept as trip documents."
  deleteBooking(id: ID!): Boolean!
  attachToBooking(attachmentId: ID!, bookingId: ID): Attachment!
  "Uploader or owner. Removes the stored file."
  deleteAttachment(id: ID!): Boolean!
  "Reads booking details from pasted confirmation text."
  parseBookingText(tripId: ID!, text: String!): [BookingDraft!]!
  updateReminderPreferences(tripId: ID!, input: ReminderPreferencesInput!): ReminderPreferences!
  "Owner only. Invalidates the old calendar link."
  resetCalendarLink(tripId: ID!): String!
  "Editors and owners. The trip's pace and how the group gets around."
  updateTripPlanning(tripId: ID!, pace: Pace!, getAround: GetAround!): Trip!
  "Editors and owners. Sets a scheduled activity's start (HH:mm, null = any time) and length."
  setActivityTiming(activityId: ID!, startTime: String, durationMinutes: Int): Activity!
  "Editors and owners. Applies the day's arrangement (order and times); no change if it isn't better."
  arrangeDay(dayId: ID!): Day!
  "Editors and owners. Attaches a real place to an activity, or removes it (null)."
  setActivityPlace(activityId: ID!, googlePlaceId: String): Activity!
  "Creates a personal access token for an AI assistant. Signed-in browser sessions only."
  createApiToken(name: String!): CreatedApiToken!
  "Revokes one of the viewer's tokens. Assistants using it lose access immediately."
  revokeApiToken(id: ID!): Boolean!
}

enum TripEventKind {
  ACTIVITY_PROPOSED
  ACTIVITY_UPDATED
  ACTIVITY_MOVED
  VOTE_CHANGED
  EXPENSE_CHANGED
  MEMBER_CHANGED
  BOOKING_CHANGED
  TRIP_DELETED
}

"Lightweight change notification; clients refetch what they display."
type TripEvent {
  tripId: ID!
  kind: TripEventKind!
  activityId: ID
  "Who made the change."
  actorId: ID
}

type Subscription {
  tripEvents(tripId: ID!): TripEvent!
}
