# When CI fails on an agent branch (agent/*), Claude Code runs /fix-ci with the failed log and pushes a
# fix — at most 2 attempts per branch, then it hands over to a human with the `needs-human` label.
name: Agent — fix CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: agent-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN: ${{ github.event.workflow_run.id }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MAX_ATTEMPTS: 2
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql://tripwise:tripwise@localhost:5432/tripwise
      JWT_SECRET: ci-only-secret-for-the-agent-run-0123456789abcdef
      STORAGE_DRIVER: memory
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripwise
          POSTGRES_PASSWORD: tripwise
          POSTGRES_DB: tripwise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tripwise" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Decide whether to try
        id: gate
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH — nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(git rev-parse HEAD)" != "$FAILED_SHA" ]; then echo "Branch moved since the failed run — skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          attempts=$(git log origin/main..HEAD --format=%B | grep -c '^Agent-CI-Fix:' || true)
          echo "attempt=$((attempts + 1))" >> "$GITHUB_OUTPUT"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            gh label create needs-human --color D93F0B --description "The agent needs a person" --force
            gh pr edit "$pr" --add-label needs-human
            gh pr comment "$pr" --body "🤖 CI still fails after $attempts automatic fix attempts ([last failure]($FAILED_RUN_URL)). Handing over to a human."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Save the failed CI log for the agent
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p qa-output
          gh run view "$FAILED_RUN" --log-failed | tail -n 400 > qa-output/ci-failure.log || true

      - uses: ./.github/actions/setup-app
        if: steps.gate.outputs.go == 'true'

      - name: Claude Code fixes CI
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            CI failed on this branch (${{ env.BRANCH }}), which belongs to an open pull request opened by the
            Tripwise agent. The failed steps' log is in qa-output/ci-failure.log; the run is ${{ env.FAILED_RUN_URL }}.

            Use the fix-ci project skill (Skill tool): reproduce with the CI steps, fix the cause (never weaken a check
            or skip a test), and prove every step green. Postgres is running and seeded (DATABASE_URL is set).

            Commit the fix with a conventional message whose body ends with this exact line:
            Agent-CI-Fix: ${{ steps.gate.outputs.attempt }}
            Do not push, do not run `gh`, and do not modify anything under .github/ — the workflow pushes your commit.
            If you can't fix it, commit nothing and explain why in qa-output/blocked.md.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite"
            --disallowedTools "Bash(git push *),Bash(gh *)"

      - name: Push the fix and re-run CI
        if: always() && steps.gate.outputs.go == 'true'
        env:
          PR: ${{ steps.gate.outputs.pr }}
          ATTEMPT: ${{ steps.gate.outputs.attempt }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$FAILED_SHA" ]; then
            gh label create needs-human --color D93F0B --description "The agent needs a person" --force
            gh pr edit "$PR" --add-label needs-human
            { echo "🤖 I couldn't fix the CI failure ([run]($RUN_URL))."; echo; cat qa-output/blocked.md 2>/dev/null; } > qa-output/comment.md
            gh pr comment "$PR" --body-file qa-output/comment.md
            exit 0
          fi
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr comment "$PR" --body "🤖 Pushed CI fix attempt $ATTEMPT of $MAX_ATTEMPTS ($(git log -1 --format=%s)). CI is running again."
