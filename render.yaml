# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service: the API also serves the built React app (same origin → cookies + WebSockets just work).
# Database + file storage: Neon (`neon deploy` writes the values below into .env.local).
services:
  - type: web
    name: tripwise
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @tripwise/web build &&
      pnpm --filter @tripwise/api build
    # Migrations run on start (pre-deploy commands need a paid plan).
    startCommand: >-
      pnpm --filter @tripwise/api db:deploy &&
      if [ "$SEED_DEMO" = "true" ]; then pnpm --filter @tripwise/api db:seed; fi &&
      pnpm --filter @tripwise/api start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Paste these from .env.local when creating the Blueprint.
      - key: DATABASE_URL # pooled — used by the app
        sync: false
      - key: DATABASE_URL_UNPOOLED # direct — used by migrations
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_DIST
        value: ../web/dist
      # Optional: Claude reads uploaded bookings (emails, PDFs, photos). Leave empty to use the built-in readers only.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: semantic search for the trip assistant (Voyage AI). Without it, keyword search only.
      - key: VOYAGE_API_KEY
        sync: false
      # Trip assistant caps for the public demo: questions per user and for the whole site, per day.
      - key: ASSISTANT_DAILY_QUESTIONS
        value: '20'
      - key: ASSISTANT_SITE_DAILY_QUESTIONS
        value: '300'
      # Resets the demo account's sample trip on every start, so the public demo stays tidy.
      - key: SEED_DEMO
        value: 'true'
